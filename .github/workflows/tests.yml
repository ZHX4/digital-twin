name: research-ci
on: [push, pull_request]
permissions:
  contents: read
  issues: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run pytest
        id: tests
        continue-on-error: true
        run: |
          pytest -q > ci-output.txt 2>&1
          status=$?
          cat ci-output.txt
          exit $status
      - name: Publish diagnostic issue
        if: steps.tests.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --title "CI diagnostic ${{ github.sha }}" --body "$(tail -c 12000 ci-output.txt)"
          exit 1
      - run: python scripts/run_experiment.py policy-comparison --size 8
      - run: python scripts/run_experiment.py sensitivity --samples 16
