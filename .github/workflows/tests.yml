name: research-ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m compileall -q app tests
      - run: pytest -q
      - run: python scripts/run_experiment.py policy-comparison --size 8
      - run: python scripts/run_experiment.py sensitivity --samples 16
