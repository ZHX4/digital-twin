name: research-ci
on: [push, pull_request]
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run tests and capture diagnostics
        id: tests
        run: |
          set +e
          pytest -q > ci-output.txt 2>&1
          status=$?
          cat ci-output.txt
          exit $status
      - name: Publish CI diagnostics
        if: failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci-output.txt
          git commit -m "ci: publish diagnostics [skip ci]" || true
          git push || true
      - run: python scripts/run_experiment.py policy-comparison --size 8
      - run: python scripts/run_experiment.py sensitivity --samples 16
